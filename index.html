<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SalesBudge Docs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SalesBudge merchant and integrator documentation" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: "SalesBudge",
        loadSidebar: true,
        subMaxLevel: 2,
        homepage: "docs/index.md",
        auto2top: true,
        // Resolve markdown links relative to the current file (../api/…, sdk/…, etc.).
        // Sidebar links must be root-absolute (/docs/…) so they work from nested pages.
        relativePath: true,
        alias: {
          "/.*/_sidebar.md": "/_sidebar.md",
        },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  </body>
</html>
